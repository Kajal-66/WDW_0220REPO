<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">Student Registration Form</h1>
    <hr>

    <form action="#" method="post">
        <label for="fullname">Fullname:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter Your Full Name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter Valid Email Address" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter Password" required><br><br>

        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">Male
        <input type="radio" id="female" name="gender" value="female">Female <br><br>

        <label for="course">Course:</label>
        <select id="course" name="course" placeholder="~~Select Your Course~~" required>
            <option value="Btech">Btech</option>
            <option value="Mtech">Mtech</option>
        </select><br><br>

        <label for="address">Address:</label><br>
    
        <textarea name="address" id="address" cols="50" rows="6" placeholder="Enter Your Address"></textarea><br><br>
    
        <input type="submit" value="Register">
        <input type="reset" value="Clear"><br><br>

        <hr>
        <p align="center">&copy; 2026 student registration portal</p>

    
    </form>

</body>
</html>
